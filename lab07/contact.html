
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GTA Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>GTA Fan Feedback</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="tierlist.html">My GTA Tier List</a>
    </nav>

    <h2>Tell Me What You Think</h2>

    <form action="#" method="post">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="favorite">What is your favorite GTA game?</label>
        <select id="favorite" name="favorite">
            <option>GTA V</option>
            <option>GTA San Andreas</option>
            <option>GTA IV</option>
            <option>Liberty City Stories</option>
            <option>GTA III</option>
            <option>GTA Vice City</option>
        </select>

        <br><br>

        <p>Do you agree with my rankings?</p>

        <input type="radio" id="yes" name="agree" value="yes">
        <label for="yes">Yes</label>

        <input type="radio" id="no" name="agree" value="no">
        <label for="no">No</label>

        <br><br>

        <label for="comments">Comments:</label>
        <br>
        <textarea id="comments" name="comments" rows="5" cols="30"></textarea>

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
